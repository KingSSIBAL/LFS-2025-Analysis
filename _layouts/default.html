<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --text: #1a1a1a; --muted: #4a4a4a; --line: #e2e2e2; --link: #0b5cad; --accent: #b3261e; --soft: #f6f6f4; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow-x: clip; color: var(--text); background: #fff;
           font: 18px/1.65 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* Text column ~70 characters (readable line length); figures break out wider below. */
    main { max-width: 70ch; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
    h1, h2, h3 { font-family: "Crimson Pro", Georgia, serif; line-height: 1.2; text-wrap: balance; }
    h1 { font-size: 2.4rem; margin: 0 0 .5rem; }
    h2 { font-size: 1.75rem; margin: 3.5rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
    h3 { font-size: 1.3rem; margin: 2rem 0 .5rem; }
    p, li { margin: 0 0 1rem; }
    li { margin-bottom: .5rem; }
    a { color: var(--link); text-underline-offset: 2px; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
    strong { color: #000; }
    .lede { font-size: 1.15rem; color: var(--muted); }
    /* Contents box */
    nav.toc { background: var(--soft); border-radius: 8px; padding: 1rem 1.25rem; margin: 1.5rem 0 2rem; }
    nav.toc ol { margin: .25rem 0 0; padding-left: 1.25rem; columns: 2; column-gap: 2rem; }
    nav.toc li { margin: 0 0 .25rem; break-inside: avoid; }
    /* Headline numbers */
    table { border-collapse: collapse; width: 100%; margin: 1rem 0 1.5rem; font-size: .95rem; }
    th, td { padding: .5rem .6rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: var(--soft); font-weight: 700; }
    td:nth-child(2) { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    /* Figures: wider than the text (up to 1200px), centred, click to open full size. */
    main a > img, main p > img { display: block; height: auto; max-width: none;
      width: min(1200px, calc(100vw - 2rem)); position: relative; left: 50%; transform: translateX(-50%);
      border: 1px solid var(--line); border-radius: 6px; margin: 1.5rem 0 .5rem; }
    .caption { font-size: .95rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: .75rem; }
    .caption strong { color: var(--text); }
    .note { background: var(--soft); border-radius: 8px; padding: .75rem 1rem; font-size: .95rem; }
    code { font-size: .9em; background: var(--soft); padding: .1em .3em; border-radius: 4px; }
    footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
    @media (max-width: 600px) { body { font-size: 17px; } h1 { font-size: 2rem; } nav.toc ol { columns: 1; }
      table { display: block; overflow-x: auto; } td:nth-child(2) { white-space: normal; } }
    @media print { main a > img, main p > img { width: 100%; left: 0; transform: none; } a { color: inherit; } }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
